<div class="mw-ch-root pal-soft" style="box-sizing:border-box;padding:16px;border-radius:8px;background:var(--pal-outer);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--pal-text);font-size:14px;">
  <style>
.pal-soft{--pal-outer:#EFF3F6;--pal-inner:#FFFFFF;--pal-fold:#4B9CB1;--pal-on-fold:#FFFFFF;--pal-text:#1D314C;--pal-muted:#5B7183}
html[data-theme="dark"] .pal-soft{--pal-outer:#0F222B;--pal-inner:#1D314C;--pal-fold:#4B9CB1;--pal-on-fold:#FFFFFF;--pal-text:#EFF6F8;--pal-muted:#A9C4CE}
@media (prefers-color-scheme: dark){html:not([data-theme]) .pal-soft{--pal-outer:#0F222B;--pal-inner:#1D314C;--pal-fold:#4B9CB1;--pal-on-fold:#FFFFFF;--pal-text:#EFF6F8;--pal-muted:#A9C4CE}}

    .mw-ch-root, .mw-ch-root *, .mw-ch-root *::before, .mw-ch-root *::after { box-sizing: border-box; }
    .mw-ch-btn { appearance:none;background:var(--pal-outer);color:var(--pal-text);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer; }
    .mw-ch-btn:focus-visible { outline:2px solid var(--pal-fold);outline-offset:2px; }
    .mw-ch-btn[aria-selected="true"] { background:var(--pal-fold);color:var(--pal-on-fold);font-weight:700; }
  </style>
  <div style="background:var(--pal-inner);border-radius:8px;padding:16px;">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
      <span style="font-weight:700;">Household budget, last six months</span>
      <span role="tablist" aria-label="Metric" id="mw-ch-list" style="display:flex;gap:6px;"></span>
    </div>
    <div id="mw-ch-chart" style="margin-top:12px;"></div>
    <div style="color:var(--pal-muted);font-size:12px;margin-top:6px;">Unit: dollars per month. Period: Jun – Nov. Data is embedded in the fragment, separate from the drawing code.</div>
  </div>
  <script>
  (function () {
    var DATA = {
      labels: ['Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov'],
      series: {
        spending: [820, 760, 910, 845, 790, 865],
        income: [1200, 1200, 1250, 1250, 1300, 1300]
      }
    };
    var METRICS = [
      { id: 'spending', label: 'Spending' },
      { id: 'income', label: 'Income' }
    ];
    var DEFAULTS = { metric: 'spending' };
    var bridge = window.hatchWidget;
    var state = bridge ? bridge.getState(DEFAULTS) : Object.assign({}, DEFAULTS);
    function render() {
      var list = document.getElementById('mw-ch-list');
      list.innerHTML = '';
      METRICS.forEach(function (m) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'mw-ch-btn';
        b.textContent = m.label;
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-selected', String(state.metric === m.id));
        b.addEventListener('click', function () {
          state = { metric: m.id };
          if (bridge) bridge.setState(state);
          render();
        });
        list.appendChild(b);
      });
      var values = DATA.series[state.metric];
      var max = Math.max.apply(null, values);
      var bars = values.map(function (v, i) {
        var h = Math.round((v / max) * 72);
        return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;">'
          + '<span style="font-size:11px;color:var(--pal-muted);">$' + v + '</span>'
          + '<div style="width:100%;max-width:36px;height:' + h + 'px;background:var(--pal-fold);border-radius:4px 4px 0 0;"></div>'
          + '<span style="font-size:11px;color:var(--pal-muted);">' + DATA.labels[i] + '</span></div>';
      }).join('');
      document.getElementById('mw-ch-chart').innerHTML =
        '<div style="display:flex;align-items:flex-end;gap:8px;">' + bars + '</div>';
    }
    window.addEventListener('hatch-widget-state', function (e) { state = e.detail.state; render(); });
    render();
  })();
  </script>
</div>
