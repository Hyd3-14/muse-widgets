<div class="pal-soft" style="box-sizing:border-box;padding:16px;border-radius:8px;background:var(--pal-outer);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--pal-text);font-size:14px;">
<style>
.pal-soft{--pal-outer:#EFF3F6;--pal-inner:#FFFFFF;--pal-fold:#4B9CB1;--pal-on-fold:#FFFFFF;--pal-text:#1D314C;--pal-muted:#5B7183}
html[data-theme="dark"] .pal-soft{--pal-outer:#0F222B;--pal-inner:#1D314C;--pal-fold:#4B9CB1;--pal-on-fold:#FFFFFF;--pal-text:#EFF6F8;--pal-muted:#A9C4CE}
@media (prefers-color-scheme: dark){html:not([data-theme]) .pal-soft{--pal-outer:#0F222B;--pal-inner:#1D314C;--pal-fold:#4B9CB1;--pal-on-fold:#FFFFFF;--pal-text:#EFF6F8;--pal-muted:#A9C4CE}}
</style>
  <div style="background:var(--pal-inner);border-radius:8px;padding:16px;">
    <div style="display:flex;justify-content:space-between;align-items:baseline;">
      <span style="font-weight:700;">Checklist</span>
      <span id="mw-cl-count" style="color:var(--pal-muted);font-size:13px;"></span>
    </div>
    <div id="mw-cl-list" style="margin-top:8px;display:flex;flex-direction:column;"></div>
    <div style="color:var(--pal-muted);font-size:12px;margin-top:8px;">Checked items persist in widget state, so the agent can read back what is left.</div>
  </div>
  <script>
  (function () {
    // Item definitions live in DATA; only the checked ids live in state.
    var ITEMS = [
      { id: 'passport', label: 'Check passport validity' },
      { id: 'booking', label: 'Save the booking confirmation' },
      { id: 'insurance', label: 'Arrange travel insurance' },
      { id: 'notify', label: 'Tell the hotel about late arrival' }
    ];
    var DEFAULTS = { checked: [] };
    var bridge = window.hatchWidget;
    var state = bridge ? bridge.getState(DEFAULTS) : Object.assign({}, DEFAULTS);
    function render() {
      var list = document.getElementById('mw-cl-list');
      list.innerHTML = '';
      ITEMS.forEach(function (item) {
        var done = state.checked.indexOf(item.id) !== -1;
        var row = document.createElement('label');
        row.style.cssText = 'display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--pal-outer);cursor:pointer;';
        var box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = done;
        box.style.accentColor = 'var(--pal-fold)';
        box.addEventListener('change', function () {
          var next = state.checked.filter(function (id) { return id !== item.id; });
          if (box.checked) next.push(item.id);
          state = { checked: next };
          if (bridge) bridge.setState(state);
          render();
        });
        var text = document.createElement('span');
        text.textContent = item.label;
        if (done) { text.style.textDecoration = 'line-through'; text.style.color = 'var(--pal-muted)'; }
        row.appendChild(box);
        row.appendChild(text);
        list.appendChild(row);
      });
      document.getElementById('mw-cl-count').textContent = state.checked.length + ' of ' + ITEMS.length + ' done';
    }
    window.addEventListener('hatch-widget-state', function (e) { state = e.detail.state; render(); });
    render();
  })();
  </script>
</div>
