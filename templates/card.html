<div class="pal-soft" style="box-sizing:border-box;padding:16px;border-radius:8px;background:var(--pal-outer);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--pal-text);">
<style>
.pal-soft{--pal-outer:#EFF3F6;--pal-inner:#FFFFFF;--pal-fold:#4B9CB1;--pal-on-fold:#FFFFFF;--pal-text:#1D314C;--pal-muted:#5B7183}
html[data-theme="dark"] .pal-soft{--pal-outer:#0F222B;--pal-inner:#1D314C;--pal-fold:#4B9CB1;--pal-on-fold:#FFFFFF;--pal-text:#EFF6F8;--pal-muted:#A9C4CE}
@media (prefers-color-scheme: dark){html:not([data-theme]) .pal-soft{--pal-outer:#0F222B;--pal-inner:#1D314C;--pal-fold:#4B9CB1;--pal-on-fold:#FFFFFF;--pal-text:#EFF6F8;--pal-muted:#A9C4CE}}
</style>
  <div style="background:var(--pal-inner);border-radius:8px;padding:16px;">
    <div style="font-size:15px;font-weight:700;margin:0 0 6px;">Card title</div>
    <div style="color:var(--pal-muted);font-size:13px;line-height:1.55;">
      One short paragraph that states the point of this card. Keep it to what the reader needs to decide or understand.
    </div>
    <div style="margin-top:12px;font-size:13px;">
      <span style="font-weight:700;">Key value</span>
      <span style="color:var(--pal-muted);"> — supporting detail</span>
    </div>
  </div>
</div>
