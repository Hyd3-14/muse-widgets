<div style="box-sizing:border-box;padding:16px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--hatch-widget-text);">
  <div style="background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);border-radius:8px;padding:16px;">
    <div style="font-size:15px;font-weight:700;margin:0 0 6px;">Card title</div>
    <div style="color:var(--hatch-widget-muted);font-size:13px;line-height:1.55;">
      One short paragraph that states the point of this card. Keep it to what the reader needs to decide or understand.
    </div>
    <div style="margin-top:12px;font-size:13px;">
      <span style="font-weight:700;">Key value</span>
      <span style="color:var(--hatch-widget-muted);"> — supporting detail</span>
    </div>
  </div>
</div>
