<div style="box-sizing:border-box;padding:16px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--hatch-widget-text);font-size:14px;">
  <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
    <span style="font-weight:700;">Progress</span>
    <span style="color:var(--hatch-widget-muted);">3 of 5 done</span>
  </div>
  <div style="display:flex;gap:4px;" role="img" aria-label="3 of 5 done">
    <span style="flex:1;height:8px;border-radius:4px;background:var(--hatch-widget-accent);"></span>
    <span style="flex:1;height:8px;border-radius:4px;background:var(--hatch-widget-accent);"></span>
    <span style="flex:1;height:8px;border-radius:4px;background:var(--hatch-widget-accent);"></span>
    <span style="flex:1;height:8px;border-radius:4px;background:var(--hatch-widget-surface-muted);border:1px solid var(--hatch-widget-border);"></span>
    <span style="flex:1;height:8px;border-radius:4px;background:var(--hatch-widget-surface-muted);border:1px solid var(--hatch-widget-border);"></span>
  </div>
  <div style="margin-top:8px;color:var(--hatch-widget-muted);font-size:13px;">Segmented bars read faster than percentages. Always pair the bar with the counts in words.</div>
</div>
