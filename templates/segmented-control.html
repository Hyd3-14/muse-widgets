<div class="mw-seg-root pal-soft" style="box-sizing:border-box;padding:16px;border-radius:8px;background:var(--pal-outer);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--pal-text);font-size:14px;">
  <style>
.pal-soft{--pal-outer:#EFF3F6;--pal-inner:#FFFFFF;--pal-fold:#4B9CB1;--pal-on-fold:#FFFFFF;--pal-text:#1D314C;--pal-muted:#5B7183}
html[data-theme="dark"] .pal-soft{--pal-outer:#0F222B;--pal-inner:#1D314C;--pal-fold:#4B9CB1;--pal-on-fold:#FFFFFF;--pal-text:#EFF6F8;--pal-muted:#A9C4CE}
@media (prefers-color-scheme: dark){html:not([data-theme]) .pal-soft{--pal-outer:#0F222B;--pal-inner:#1D314C;--pal-fold:#4B9CB1;--pal-on-fold:#FFFFFF;--pal-text:#EFF6F8;--pal-muted:#A9C4CE}}

    .mw-seg-root, .mw-seg-root *, .mw-seg-root *::before, .mw-seg-root *::after { box-sizing: border-box; }
    .mw-seg-btn { appearance:none;background:var(--pal-inner);color:var(--pal-text);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;transition:opacity 120ms ease; }
    .mw-seg-btn:hover { opacity:.85; }
    .mw-seg-btn:focus-visible { outline:2px solid var(--pal-fold);outline-offset:2px; }
    .mw-seg-btn[aria-selected="true"] { background:var(--pal-fold);color:var(--pal-on-fold);font-weight:700; }
    @media (prefers-reduced-motion: reduce) { .mw-seg-btn { transition:none; } }
  </style>
  <div role="tablist" aria-label="Plan" id="mw-seg-list" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
  <div id="mw-seg-detail" style="margin-top:10px;color:var(--pal-muted);font-size:13px;"></div>
  <script>
  (function () {
    var OPTIONS = [
      { id: 'basic', label: 'Basic', detail: 'For trying things out.' },
      { id: 'standard', label: 'Standard', detail: 'For everyday use.' },
      { id: 'pro', label: 'Pro', detail: 'For heavy, regular use.' }
    ];
    var DEFAULTS = { selected: 'standard' };
    var bridge = window.hatchWidget;
    var state = bridge ? bridge.getState(DEFAULTS) : Object.assign({}, DEFAULTS);
    var list = document.getElementById('mw-seg-list');
    function render() {
      list.innerHTML = '';
      OPTIONS.forEach(function (opt) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'mw-seg-btn';
        b.textContent = opt.label;
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-selected', String(state.selected === opt.id));
        b.addEventListener('click', function () {
          state = { selected: opt.id };
          if (bridge) bridge.setState(state);
          render();
        });
        list.appendChild(b);
      });
      var current = OPTIONS.filter(function (o) { return o.id === state.selected; })[0];
      document.getElementById('mw-seg-detail').textContent = current ? current.detail : '';
    }
    window.addEventListener('hatch-widget-state', function (e) { state = e.detail.state; render(); });
    render();
  })();
  </script>
</div>
