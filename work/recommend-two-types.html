<div style="box-sizing:border-box;padding:16px;font-family:inherit;color:var(--hatch-widget-text);display:flex;flex-direction:column;gap:12px;">
  <div style="font-weight:700;font-size:14px;">推薦には2種類ある</div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;">
    <div style="background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);border-radius:8px;padding:12px;">
      <div style="font-weight:700;font-size:13px;">学校推薦・教授推薦の枠</div>
      <div style="font-size:12px;color:var(--hatch-widget-muted);margin-top:4px;line-height:1.7;">
        大学と企業の間の推薦枠で応募する制度。書類選考や一次面接が免除されることがある代わりに、内定の辞退が重く、職業選択の自由の観点で大学が慎重に扱う。今回の話とは別物。
      </div>
    </div>
    <div style="background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);border-radius:8px;padding:12px;">
      <div style="display:inline-block;background:var(--hatch-widget-accent);color:var(--hatch-widget-on-accent);font-weight:700;font-size:11px;border-radius:999px;padding:2px 8px;">今回の形</div>
      <div style="font-weight:700;font-size:13px;margin-top:6px;">任意提出の推薦状（リファレンスレター）</div>
      <div style="font-size:12px;color:var(--hatch-widget-muted);margin-top:4px;line-height:1.7;">
        雇用主や先生が個人として書く裏付け資料。提出しても辞退の制約は生まれない。汎用宛名で作れば何社にも使い回せる。一部の企業は提出書類に「推薦状（任意）」と明記している。
      </div>
    </div>
  </div>
  <div style="font-size:12px;color:var(--hatch-widget-muted);line-height:1.7;">出す先は、任意提出の枠がある企業、追加資料を受け付けるインターン、面接への持参、リファレンスチェックの場面。枠がない応募に無理に添付はしない。</div>
</div>
