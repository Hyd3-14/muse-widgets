<div class="cw">
<style>
.cw{box-sizing:border-box;font-family:"Noto Sans JP",sans-serif;color:var(--hatch-widget-text);padding:16px;max-width:100%}
.cw *{box-sizing:border-box}
.cw h3{margin:0 0 8px;font-size:15px}
.cw p{margin:0;font-size:13px;line-height:1.6;color:var(--hatch-widget-muted)}
.cw-card{background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);border-radius:8px;padding:16px;margin-bottom:24px}
.cw-card:last-child{margin-bottom:0}
.cw-flow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:640px){.cw-flow{grid-template-columns:1fr}}
.cw-step{border:1px solid var(--hatch-widget-border);border-radius:8px;padding:12px 16px;background:var(--hatch-widget-surface);min-width:0}
.cw-step b{display:block;font-size:13.5px;margin-bottom:4px}
.cw-step span{font-size:12.5px;color:var(--hatch-widget-muted);line-height:1.55}
.cw-badge{display:inline-flex;background:var(--hatch-widget-accent);color:var(--hatch-widget-on-accent);font-size:12px;font-weight:700;border-radius:4px;padding:2px 8px;margin-bottom:8px}
.cw-badge.mut{background:var(--hatch-widget-surface-muted);color:var(--hatch-widget-text);border:1px solid var(--hatch-widget-border)}
</style>

<div class="cw-flow">
<div class="cw-step"><span class="cw-badge">入口</span><b>home で起動する</b><span>横断の相談はここでそのまま話す。対象が決まってない段階の受け口</span></div>
<div class="cw-step"><span class="cw-badge mut">移動</span><b>対象 repo へ移る</b><span>作業が決まったら、その repo（の worktree）の中で進める。repo の AGENTS.md と GLOSSARY が効くのは中に入ってから</span></div>
<div class="cw-step"><span class="cw-badge mut">記録</span><b>成果と決定を戻す</b><span>成果は対象 repo へ、跨ぐ決定は vault へ。home には何も溜めない</span></div>
</div>
</div>
