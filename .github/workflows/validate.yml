name: Validate widgets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate templates and examples
        run: python3 tools/validate-widget.py templates examples

      - name: Check the demo is current
        run: |
          python3 tools/build-demo.py
          git diff --exit-code docs/index.html

  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Playwright and browsers
        run: |
          pip install playwright
          playwright install --with-deps chromium webkit
      - name: Render every template and fail on layout breakage
        run: python3 tools/layout_check.py
